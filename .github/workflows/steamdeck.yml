name: Steam Deck package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'assets/**'
      - 'scripts/*moye.sh'
      - 'scripts/build-steamdeck.sh'
      - '.github/workflows/steamdeck.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run tests
        run: cargo test --release --locked
      - name: Build portable package
        run: sh scripts/build-steamdeck.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoYe-SteamDeck-x86_64
          path: dist/MoYe-SteamDeck-x86_64.tar.gz
          if-no-files-found: error
